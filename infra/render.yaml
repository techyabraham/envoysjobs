services:
  - type: web
    name: envoysjobs-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: envoysjobs-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: MAIL_PROVIDER
        value: console
      - key: RESEND_API_KEY
        value: ""
      - key: S3_ENDPOINT
        value: ""
      - key: S3_PUBLIC_URL
        value: ""
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: envoysjobs
      - key: S3_ACCESS_KEY
        value: ""
      - key: S3_SECRET_KEY
        value: ""

databases:
  - name: envoysjobs-db
    databaseName: envoysjobs
    user: envoysjobs
    plan: starter
