services:
  - type: web
    name: envoysjobs-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: USE_MEMORY
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: envoysjobs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          name: envoysjobs-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_URL
        fromService:
          name: envoysjobs-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MAIL_PROVIDER
        value: resend
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false

  - type: web
    name: envoysjobs-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: envoysjobs-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_INTERNAL_HOST
        fromService:
          name: envoysjobs-api
          type: web
          property: host
      - key: API_INTERNAL_PORT
        fromService:
          name: envoysjobs-api
          type: web
          property: port
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          name: envoysjobs-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: envoysjobs-db
    databaseName: envoysjobs
    user: envoysjobs
    plan: starter
